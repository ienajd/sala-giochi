<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Sbuca!</title>
<meta name="description" content="42 labirinti, dal più facile al più intricato: chiavi, ponti, portali, buchi neri e ascensori.">
<meta name="theme-color" content="#16203a">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Sbuca!">
<link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icona.png"><link rel="icon" type="image/png" href="icona.png">
<style>
/* Sbuca! — il labirinto occupa tutto lo schermo; sopra, una sola riga di cruscotto. Le schermate (nome, livelli, classifica) sono carte al centro. */
:root{
  --fondo:#16203a; --carta:#fffaf0; --inchiostro:#22283c; --tenue:#6b7389; --riga:#e6dcc6;
  --oro:#ffc21f; --oro-scuro:#b97e00; --tasto:#ff7a3d; --tasto-scuro:#c9521c; --verde:#2fae63;
  --tondo:ui-rounded,"SF Pro Rounded","Arial Rounded MT Bold","Nunito","Trebuchet MS",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{height:100%;overscroll-behavior:none}
body{margin:0;background:var(--fondo);color:var(--inchiostro);font-family:var(--tondo);font-size:17px;line-height:1.4;overflow:hidden}
#app{position:relative;height:100%;overflow:hidden;background:var(--fondo)}
#app,#app *{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#iNome{-webkit-user-select:text;user-select:text}
h1,h2,p,ol,dl,dd{margin:0}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:3px solid #3b82f6;outline-offset:2px}
#tela{position:absolute;inset:0;width:100%;height:100%;display:block;outline:none;touch-action:none}

/* cruscotto: una riga sola */
#hud{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;gap:6px;pointer-events:none;
  padding:max(8px,env(safe-area-inset-top,0px)) max(10px,env(safe-area-inset-right,0px)) 0 max(10px,env(safe-area-inset-left,0px))}
#hud > *{pointer-events:auto}
.chip{background:rgba(255,250,240,.94);border-radius:999px;padding:6px 12px;font-weight:800;font-size:15px;font-variant-numeric:tabular-nums;box-shadow:0 2px 0 rgba(0,0,0,.18);white-space:nowrap}
#hStelle{letter-spacing:.08em;color:#c9c2ad}
#hStelle b{color:var(--oro);text-shadow:0 1px 0 var(--oro-scuro)}
#hChiave{display:inline-flex;align-items:center;gap:6px;padding:4px 10px}
#hChiave i{width:16px;height:16px;border-radius:50%;display:inline-block;border:2px solid var(--inchiostro)}
#hTempo{margin-left:auto}
#bPausa,#bMappa{background:var(--carta);border:0;border-radius:12px;height:38px;min-width:42px;padding:0 12px;font-weight:900;font-size:16px;box-shadow:0 3px 0 rgba(0,0,0,.25)}
#bPausa:active,#bMappa:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.25)}
#fumetto{position:absolute;left:50%;transform:translateX(-50%);top:calc(max(8px,env(safe-area-inset-top,0px)) + 50px);width:max-content;max-width:min(520px,calc(100% - 24px));
  background:var(--carta);border-radius:16px;padding:10px 16px;font-weight:800;text-align:center;box-shadow:0 4px 0 rgba(0,0,0,.2);pointer-events:none}
#fumetto.entra{animation:entra .25s ease-out}
@keyframes entra{from{opacity:0;transform:translateX(-50%) translateY(-8px)}to{opacity:1;transform:translateX(-50%)}}

/* schermate */
.schermo,.velo{position:absolute;inset:0;display:flex;overflow:auto;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.schermo{background:radial-gradient(circle at 50% 20%,#27407a,#16203a 70%)}
.velo{background:rgba(10,14,28,.62)}
.carta{margin:auto;width:100%;max-width:440px;background:var(--carta);border-radius:26px;padding:24px 22px;display:flex;flex-direction:column;gap:14px;text-align:center;box-shadow:0 10px 0 rgba(0,0,0,.22),0 24px 60px rgba(0,0,0,.35)}
.carta.larga{max-width:760px;text-align:left}
.carta.stretta{max-width:360px}
.logo{font-size:clamp(46px,13vw,72px);line-height:1;font-weight:900;color:var(--tasto);text-shadow:0 4px 0 var(--tasto-scuro),0 8px 0 rgba(0,0,0,.12);letter-spacing:.01em;transform:rotate(-3deg);margin:4px 0 2px}
h2{font-size:24px;font-weight:900;line-height:1.15;text-wrap:balance}
.motto{color:var(--tenue);font-weight:700}
.piccolo{color:var(--tenue);font-size:14.5px;font-weight:700}
#ciao{font-weight:800;font-size:19px}
button.grande{background:var(--tasto);color:#fff;border:0;border-radius:18px;padding:15px 18px;font-size:21px;font-weight:900;box-shadow:0 6px 0 var(--tasto-scuro);width:100%}
button.grande:active{transform:translateY(4px);box-shadow:0 2px 0 var(--tasto-scuro)}
.carta > button:not(.grande),.riga button{background:#fff;border:2px solid var(--riga);border-radius:14px;padding:11px 14px;font-weight:800;box-shadow:0 3px 0 var(--riga)}
.carta > button:not(.grande):active,.riga button:active{transform:translateY(2px);box-shadow:0 1px 0 var(--riga)}
.riga{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.riga button{flex:1 1 auto}
#fNome{display:flex;flex-direction:column;gap:12px}
#iNome{font:inherit;font-size:22px;font-weight:800;text-align:center;border:3px solid var(--riga);border-radius:16px;padding:12px;background:#fff;color:var(--inchiostro);width:100%}
#elencoNomi{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:8px}
#elencoNomi button{background:#fff;border:2px solid var(--riga);border-radius:999px;padding:8px 14px;font-weight:800}
.testa{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.testa > :last-child{justify-self:end}
.indietro{justify-self:start;background:none;border:0;font-weight:900;color:var(--tasto-scuro);padding:6px 4px;font-size:16px}
.mondo{border-top:2px solid var(--riga);padding-top:12px;margin-top:12px;display:flex;flex-direction:column;gap:8px}
.mondo:first-child{border-top:0;margin-top:0;padding-top:0}
.mondo h3{margin:0;font-size:19px;font-weight:900;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.mondo h3 small{font-size:14px;color:var(--tenue);font-weight:800}
.mondo p{color:var(--tenue);font-size:14.5px;font-weight:700}
.tessere{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
@media (max-width:520px){.tessere{grid-template-columns:repeat(3,minmax(0,1fr))}}
.tessera{aspect-ratio:1/1;border-radius:16px;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-weight:900;font-size:22px;color:#fff;box-shadow:0 5px 0 rgba(0,0,0,.25);min-width:0}
.tessera small{font-size:13px;letter-spacing:.06em;color:rgba(255,255,255,.45)}
.tessera small b{color:#ffe27a}
.tessera:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.25)}
.tessera.chiusa{background:#d9d3c3 !important;color:#a39d8d;box-shadow:0 5px 0 #bdb7a6;cursor:default}
.tessera.prossima{outline:4px solid var(--oro);outline-offset:2px}
#classifica{list-style:none;padding:0;display:flex;flex-direction:column;gap:8px;text-align:left}
#classifica li{display:grid;grid-template-columns:34px minmax(0,1fr) auto auto;gap:10px;align-items:center;background:#fff;border:2px solid var(--riga);border-radius:14px;padding:10px 12px;font-weight:800}
#classifica li.io{border-color:var(--tasto);background:#fff3ea}
#classifica .pos{font-size:20px;text-align:center}
#classifica .nome{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#classifica .st{color:var(--oro-scuro);font-variant-numeric:tabular-nums}
#classifica .pt{font-variant-numeric:tabular-nums}
.eyebrow{font-weight:900;letter-spacing:.12em;text-transform:uppercase;font-size:14px;color:var(--verde)}
#fStelle{font-size:58px;line-height:1;letter-spacing:.06em;color:#d9d3c3}
#fStelle b{color:var(--oro);text-shadow:0 3px 0 var(--oro-scuro);display:inline-block;animation:salta .45s cubic-bezier(.3,1.6,.5,1) both}
#fStelle b:nth-child(2){animation-delay:.18s}#fStelle b:nth-child(3){animation-delay:.36s}
@keyframes salta{from{transform:scale(0) rotate(-40deg)}to{transform:scale(1)}}
#fPunti{font-size:40px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1}
#fConti{display:grid;grid-template-columns:1fr auto;gap:4px 14px;text-align:left;font-weight:700;color:var(--tenue);font-size:15px}
#fConti dd{text-align:right;font-variant-numeric:tabular-nums;color:var(--inchiostro)}
.record{background:var(--oro);border-radius:999px;padding:4px 14px;font-weight:900;align-self:center}
@media (prefers-reduced-motion:reduce){#fStelle b,#fumetto.entra{animation:none}}

</style>
</head>
<body>
<div id="app">
  <canvas id="tela" tabindex="0" aria-label="Il labirinto"></canvas>

  <div id="hud" hidden>
    <button id="bPausa" type="button" aria-label="Pausa">☰</button>
    <span id="hLiv" class="chip"></span>
    <span id="hStelle" class="chip" aria-label="Stelline prese"></span>
    <span id="hChiave" class="chip" hidden></span>
    <span id="hPiano" class="chip" hidden></span>
    <span id="hTempo" class="chip">0:00</span>
    <button id="bMappa" type="button" hidden>Mappa</button>
  </div>
  <div id="fumetto" hidden></div>

  <section id="sNome" class="schermo" hidden>
    <div class="carta">
      <h1 class="logo">Sbuca!</h1>
      <h2>Come ti chiami?</h2>
      <form id="fNome" autocomplete="off">
        <input id="iNome" type="text" maxlength="12" placeholder="Il tuo nome" aria-label="Il tuo nome" enterkeyhint="go">
        <button type="submit" class="grande">Gioca</button>
      </form>
      <div id="giaQui" hidden><p class="piccolo">Oppure scegli chi sta giocando:</p><div id="elencoNomi"></div></div>
    </div>
  </section>

  <section id="sHome" class="schermo" hidden>
    <div class="carta">
      <h1 class="logo">Sbuca!</h1>
      <p class="motto">42 labirinti, dal più facile al più intricato.</p>
      <p id="ciao"></p>
      <button id="bContinua" type="button" class="grande"></button>
      <div class="riga">
        <button id="bLivelli" type="button">Livelli</button>
        <button id="bClassifica" type="button">Classifica</button>
        <button id="bCambia" type="button">Cambia giocatore</button>
      </div>
      <p id="totali" class="piccolo"></p>
    </div>
  </section>

  <section id="sLivelli" class="schermo" hidden>
    <div class="carta larga">
      <div class="testa"><button type="button" class="indietro" data-vai="sHome">‹ Indietro</button><h2>Livelli</h2><span id="totStelle" class="chip"></span></div>
      <div id="mondi"></div>
    </div>
  </section>

  <section id="sClassifica" class="schermo" hidden>
    <div class="carta">
      <div class="testa"><button type="button" class="indietro" data-vai="sHome">‹ Indietro</button><h2>Classifica</h2><span></span></div>
      <p class="piccolo">Chi ha giocato su questo telefono o computer.</p>
      <ol id="classifica"></ol>
    </div>
  </section>

  <section id="sPausa" class="velo" hidden>
    <div class="carta stretta">
      <h2>Pausa</h2>
      <button id="pRiprendi" type="button" class="grande">Riprendi</button>
      <button id="pRicomincia" type="button">Ricomincia il livello</button>
      <button id="pLivelli" type="button">Scegli un livello</button>
      <button id="pSuono" type="button">Suono: sì</button>
      <button id="pCasa" type="button">Schermata iniziale</button>
    </div>
  </section>

  <section id="sFine" class="velo" hidden>
    <div class="carta stretta">
      <p id="fTitolo" class="eyebrow">Livello superato</p>
      <div id="fStelle" aria-hidden="true"></div>
      <div id="fPunti"></div>
      <dl id="fConti"></dl>
      <p id="fRecord" class="record" hidden>Nuovo record!</p>
      <button id="fAvanti" type="button" class="grande">Avanti</button>
      <div class="riga"><button id="fRigioca" type="button">Rigioca</button><button id="fLivelli" type="button">Livelli</button></div>
    </div>
  </section>
</div>

  document.querySelectorAll('.indietro').forEach(b => b.addEventListener('click', casa));
  $('#bLivelli').onclick = livelli; $('#bClassifica').onclick = classifica; $('#bCambia').onclick = chiedeNome;
  $('#bPausa').onclick = () => pausa(true); $('#bMappa').onclick = () => { G.mappa = !G.mappa; tela.focus(); };
  $('#pRiprendi').onclick = () => pausa(false); $('#pRicomincia').onclick = () => gioca(R.i); $('#pLivelli').onclick = () => { salvaRipresa(); livelli(); };
  $('#pCasa').onclick = () => { salvaRipresa(); casa(); };
  $('#pSuono').onclick = () => { DB.suono = !DB.suono; salva(); $('#pSuono').textContent = 'Suono: ' + (DB.suono ? 'sì' : 'no'); };
  $('#fAvanti').onclick = () => R.i === LV.length - 1 ? classifica() : gioca(R.i + 1);
  $('#fRigioca').onclick = () => gioca(R.i); $('#fLivelli').onclick = livelli;
}
function collaudo() {
  VELOCE = true; const out = []; let ok = 0;
  LV.forEach((L, i) => { carica(i); let r = ''; for (const ch of L.sol) { r = avanza(LETT.indexOf(ch)); if (r === 'no' || r === 'porta') break; } const st = [1, 2, 4].filter(b => G.sm & b).length; if (r === 'fine' && st === 3) ok++; else out.push(nomeLiv(i) + ':' + r + '/' + st); });
  document.title = 'COLLAUDO ' + ok + '/' + LV.length + (out.length ? ' ERRORI ' + out.join(' ') : ' tutti risolti con 3 stelline');
}
function avvio() {
  if (location.hash === '#collaudo') { collaudo(); return; }
  tela = $('#tela'); cx = tela.getContext('2d'); dimensiona(); lega();
  window.__sbuca = { gioca: i => { if (!DB.cur) { DB.g.Prova = { liv: {}, ripresa: null }; DB.cur = 'Prova'; } gioca(i); }, stato: () => ({ n: G.n, sm: G.sm, mano: G.mano, t: G.t, modo: MODO }) };
  casa(); requestAnimationFrame(quadro);
}
avvio();
})();
