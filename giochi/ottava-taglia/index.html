const TAU=Math.PI*2;
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t, liscio=t=>{t=clamp(t,0,1);return t*t*(3-2*t)};
function casuale(seme){let a=seme>>>0;return function(){a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

const mix=(a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t];
const molt=(a,b)=>[a[0]*b[0]/255,a[1]*b[1]/255,a[2]*b[2]/255];

const NOTE={C:0,D:2,E:4,F:5,G:7,A:9,B:11};
function midiDi(s){ let i=1, v=NOTE[s[0]]; if(s[i]==='#'){v++;i++} else if(s[i]==='b'){v--;i++} return v+12*(+s.slice(i)+1) }
// un brano: accordi, giri di basso e di chitarra, percussioni, due melodie, e una forma che li fa entrare e uscire
function brano(b){
 b.bat=b.bat||8;
 b.acc=b.acc.split(' ').map(a=>{ let i=1, r=NOTE[a[0]]; if(a[i]==='#'){r++;i++} else if(a[i]==='b'){r--;i++} const q=a.slice(i), m=q[0]==='m', bs=40+((r+8)%12), n=[bs+12,bs+12+(m?3:4),bs+19]; if(q.indexOf('7')>=0) n.push(bs+22); return {b:bs,n:n} });

 const righe=v=>v?v.split('|'):null; b.basso=righe(b.basso); b.pen=righe(b.pen);
 for(const gr of ['perc','perc2']) if(b[gr]) for(const k in b[gr]) b[gr][k]=righe(b[gr][k]);
 return b;
}

 galoppo:brano({p:.145,acc:'Em Em C D Em G D B',basso:'R.RRR.RR',pen:'..x.u.x.',str:'nylon',voce:'tromba',voce2:'fischio',perc:{Z:'x.xxx.xx',K:'x...x...',M:'..x...x.'},
